# Triggered on v* tag pushes: builds the release APK, signs it against the keystore
# secret, and attaches it to the GitHub Release under the tag name (creating the
# Release when it does not exist). The full build gate (compile, tests, format and
# lint checks) runs on the tag itself before anything is uploaded — a tag may point
# at a commit that never went through the Build workflow.
#
# This workflow holds the APK signing key, making it a high-value supply-chain
# target: every action is pinned by commit SHA (a tag can be re-pointed on the repo
# side; the trailing comment records the version), and upgrades land only through
# Dependabot PRs that change the SHA, merged after a human reviews the diff.
#
# Required repository secrets (APK signing — app/build.gradle.kts reads the same
# keystore.properties contract for local builds):
#   KEYSTORE_BASE64 — the keystore file, base64-encoded
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD — its credentials
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # Tag re-pushes queue behind the running release instead of cancelling it: an
  # upload interrupted mid-flight leaves a half-attached Release
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Signing-credentials gate before the long build: a missing configuration fails
      # loudly and early. A missing keystore would otherwise surface as an unsigned APK
      # attached to the Release — app/build.gradle.kts treats an absent keystore.properties
      # as "signing not configured" and silently skips signing. Only non-emptiness is
      # asserted, no value is echoed
      - name: Check signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!secret}" || {
              echo "$secret is missing or empty — configure it in the repository's Actions secrets; the release APK cannot be signed"
              exit 1
            }
          done

      # APK signing key, decoded to disk once and shaped into the keystore.properties the
      # app module reads — the same contract local builds use, gitignored on both sides.
      # storeFile is resolved via rootProject.file(), so a repo-root-relative path works;
      # the secret values ride in through the environment and never touch a command line
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > signing.keystore
          {
            echo "storeFile=signing.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Same gate the Build workflow runs: this workflow executes gradlew too, and it
      # publishes — a tampered wrapper must fail before anything reaches the Release
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # Same gate the Build workflow runs on main: the tag may point at a commit that
      # never went through CI (pushed from a feature branch, say). keystore.properties
      # is on disk, so :app:assembleRelease within `build` signs the APK in this same run
      - name: Build and test
        run: ./gradlew build

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          cp "$APK" "release-assets/countdown-${GITHUB_REF_NAME}.apk"
          echo "Collected $(find release-assets -type f | wc -l) files"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/*
          generate_release_notes: true
