name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  # Manual trigger: re-run the whole pipeline without an empty commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All actions are pinned by commit SHA (a tag can be re-pointed on the repo side;
# the trailing comment records the version). Upgrades land through Dependabot PRs
# that update the SHA, merged after a human reviews the diff
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # Full gate: compile, tests, lint and spotlessCheck. The release build stays
      # unsigned here — no keystore.properties on the runner; signing happens only
      # in the Release workflow
      - name: Build, test and lint (includes spotlessCheck)
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
